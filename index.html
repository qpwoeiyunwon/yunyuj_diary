// 서버 저장: Firestore(글·기록) + Cloudinary(사진)
var Cloud = (function () {
var enabled = !!(FIREBASE_CONFIG.projectId && CLOUDINARY.cloudName && CLOUDINARY.uploadPreset && window.firebase);
var db = null;
if (enabled) {
try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); } catch (e) { enabled = false; }
}
function col(code) { return db.collection('couples').doc(code).collection('entries'); }
return {
enabled: enabled,
getCode: function () { try { return localStorage.getItem('cc-couple-code') || ''; } catch (e) { return ''; } },
setCode: function (c) { try { localStorage.setItem('cc-couple-code', c); } catch (e) { } },
subscribe: function (code, onData, onErr) {
return col(code).onSnapshot(function (snap) {
var all = {};
snap.forEach(function (doc) {
var x = doc.data();
var key = x.m + '-' + x.d;
all[key] = all[key] || {};
all[key][x.year] = { photos: x.photos || [], title: x.title || '', body: x.body || '' };
});
onData(all);
}, onErr);
},
subscribeSettings: function (code, onData, onErr) {
return db.collection('couples').doc(code).onSnapshot(function (doc) { onData(doc.exists ? doc.data() : null); }, onErr);
},
saveBg: function (bg) {
return db.collection('couples').doc(this.getCode()).set({ bg: bg }, { merge: true });
},
save: function (m, d, year, rec) {
return col(this.getCode()).doc((m + 1) + '-' + d + '-' + year).set({
m: m, d: d, year: year,
photos: rec.photos, title: rec.title, body: rec.body,
updatedAt: firebase.firestore.FieldValue.serverTimestamp()
});
},
upload: function (dataUrl) {
var fd = new FormData();
fd.append('file', dataUrl);
fd.append('upload_preset', CLOUDINARY.uploadPreset);
fd.append('folder', 'couple-calendar');
return fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY.cloudName + '/image/upload', { method: 'POST', body: fd })
.then(function (r) { if (!r.ok) throw new Error('upload ' + r.status); return r.json(); })
.then(function (j) { return j.secure_url; });
}
};
})();

// 인라인 스타일 문자열 → React 스타일 객체
var CSS_CACHE = new Map();
function css(str) {
var hit = CSS_CACHE.get(str);
if (hit) return hit;
var o = {};
str.split(';').forEach(function (d) {
var i = d.indexOf(':');
if (i < 0) return;
var k = d.slice(0, i).trim();
var val = d.slice(i + 1).trim();
if (!k) return;
var vendor = k.indexOf('-webkit-') === 0;
if (vendor) k = k.slice(8);
k = k.replace(/-([a-z])/g, function (m, ch) { return ch.toUpperCase(); });
if (vendor) k = 'Webkit' + k.charAt(0).toUpperCase() + k.slice(1);
o[k] = val;
});
if (CSS_CACHE.size > 4000) CSS_CACHE.clear();
CSS_CACHE.set(str, o);
return o;
}

// 사진 줄이기: 긴 변 max px, JPEG 85%
function fileToDataUrl(file, max) {
return new Promise(function (resolve) {
var url = URL.createObjectURL(file);
var img = new Image();
img.onload = function () {
var w = img.naturalWidth, h = img.naturalHeight;
var s = Math.min(1, max / Math.max(w, h));
var cv = document.createElement('canvas');
cv.width = Math.round(w * s);
cv.height = Math.round(h * s);
cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
URL.revokeObjectURL(url);
resolve(cv.toDataURL('image/jpeg', 0.85));
};
img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
img.src = url;
});
}

constructor(props) {

render() {
var self = this;
var st = this.state || {};

codeError: st.codeError || '',

submitCode: function (e) {
e.preventDefault();

counts: [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31],

var day = r * 7 + col + 1;
var real = day <= n;
var ent = real ? entries[m + '-' + day] : null;
var lt = ent ? self.latest(ent) : null;
var ph = lt ? thumb(self.firstPhoto(lt.rec)) : '';
var tag = lt && lt.rec.title ? lt.rec.title + ' / ' + self.anniv(m, day, lt.year) : '';
return {
d: real ? day : '',
w: w.toFixed(2),
size: Math.min(Math.max(9 + w * 0.15, 11), 30).toFixed(1),
vis: real ? 'visible' : 'hidden',
disabled: !real,
hidden: real ? 'false' : 'true',
label: real ? (m + 1) + '월 ' + day + '일' : '',
hasPhoto: !!ph,
photo: ph,
numColor: ph ? '#FFFFFF' : 'inherit',
numShadow: ph ? '0 1px 3px rgba(0, 0, 0, 0.5)' : 'none',
hasTag: !!tag && w > 70,
tag: tag,
open: real ? (function (mm, dd) { return function () { if (!(self.state || {}).editor) self.openEditor(mm, dd); }; })(m, day) : null,
down: real ? (function (mm, dd) { return function (e) { self._press = { m: mm, d: dd, x: e.clientX, y: e.clientY, t: Date.now() }; }; })(m, day) : null
};
});
rows.push({
key: m + '-' + r,
h: rowH.toFixed(1),
cells: cells,
move: (function (mm, rr, lc) { return function (e) { self.queueFocus(mm, rr, lc, e); }; })(m, r, rowLast)
});
}
return { idx: m, name: c.en[m], rows: rows };
});

// 배경색 팔레트: 계절별 팬톤 컴러 5개씩
var PALETTE = [
{ name: '봄', colors: [['Rose Quartz', '13-1520', '#F7CAC9'], ['Peach Fuzz', '13-1023', '#FFBE98'], ['Pale Dogwood', '13-1404', '#EDCDC2'], ['Buttercup', '12-0752', '#FAE03C'], ['Greenery', '15-0343', '#88B04B']] },
{ name: '여름', colors: [['Serenity', '15-3919', '#92A8D1'], ['Aqua Sky', '14-4811', '#7BC4C4'], ['Turquoise', '15-5519', '#45B5AA'], ['Illuminating', '13-0647', '#F5DF4D'], ['Living Coral', '16-1546', '#FF6F61']] },
{ name: '가을', colors: [['Sand Dollar', '13-1106', '#DECDBE'], ['Mimosa', '14-0848', '#F0C05A'], ['Mocha Mousse', '17-1230', '#A47864'], ['Tangerine Tango', '17-1463', '#DD4124'], ['Marsala', '18-1438', '#955251']] },
{ name: '겨울', colors: [['Cerulean', '15-4020', '#9BB7D4'], ['Ultimate Gray', '17-5104', '#939597'], ['Very Peri', '17-3938', '#6667AB'], ['Ultra Violet', '18-3838', '#5F4B8B'], ['Classic Blue', '19-4052', '#0F4C81']] }
];
var DEFAULT_BG = '#EFEAFB';
var bg = st.bg || DEFAULT_BG;
function lum(hex) {
var v = [1, 3, 5].map(function (i) {
var x = parseInt(hex.substr(i, 2), 16) / 255;
return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
});
return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
// 배경에 검정/흰 글씨 중 더 잘 보이는 쪽을 자동 선택
var L = lum(bg);
var darkText = (L + 0.05) / (lum('#111111') + 0.05) >= 1.05 / (L + 0.05);
var ink = darkText ? '#1F1A33' : '#FFFFFF';
var inkHead = darkText ? '#111111' : '#FFFFFF';
var inkSub = bg === DEFAULT_BG ? '#5A4FA8' : (darkText ? '#2A2440' : '#F3F0FF');
// 월력 MONTH 칸: 배경색을 따라감 (어두운 배경은 흰색과 섞어 밝게 해서 검정 글씨가 잘 보이게)
function mixWhite(hex, t) {
return '#' + [1, 3, 5].map(function (i) {
var v = parseInt(hex.substr(i, 2), 16);
var o = Math.round(v + (255 - v) * t);
return (o < 16 ? '0' : '') + o.toString(16);
}).join('');
}
var miniHead = darkText ? bg : mixWhite(bg, 0.55);
var bgName = '기본 배경';
var seasons = PALETTE.map(function (s) {
return {
name: s.name,
colors: s.colors.map(function (col) {
var on = col[2] === bg;
if (on) bgName = 'PANTONE ' + col[1] + ' ' + col[0];
return {
hex: col[2],
label: col[0] + ' ' + col[1],
pressed: on ? 'true' : 'false',
ring: on ? '0 0 0 2px #FFFFFF, 0 0 0 4px #111111' : 'none',
pick: function () { self.setState({ bg: col[2] }); Cloud.saveBg(col[2]).catch(function () { }); }
};
})
};
});

// 기록 창
var eh = this.editorHandlers();
var ed = st.editor;
var dr = st.draft || { year: null, photos: [null, null, null], title: '', body: '' };
var vvW = st.vvW || cw + 32;
var vvH = st.vvH || viewH + 160;
var boxSize = Math.round(Math.max(Math.min(vvW - 32, vvH - 32, 460), 300));
var photos = (dr.photos || []).filter(Boolean);
var editing = st.mode !== 'view';
var photoTiles = photos.map(function (src, i) {
return {
no: i + 1,
src: src,
remove: function () {
var p = photos.slice();
p.splice(i, 1);
self.setDraft({ photos: p });
}
};
});
var wheelYears = this.yearRange().map(function (y) {
var on = y === (st.pendingYear || dr.year);
return {
y: y,
color: on ? '#000000' : 'rgba(60, 60, 67, 0.45)',
weight: on ? '600' : '400',
pick: function () { self.pickPending(y); self.scrollWheelTo(y, true); }
};
});
function rgba(hex, a) {
return 'rgba(' + [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(', ') + ', ' + a + ')';
}

// 빨간 표시: ① 화면 중앙에 들어온 월(스크롤) → ② 그 뒤 커서/터치한 날짜의 월
var cur = st.lastSrc === 'pointer' && st.lastM != null ? st.lastM : (st.cur || 0);
var miniMonths = c.ab.map(function (ab, i) {
return { abbr: ab, bg: i === cur ? '#D62839' : 'transparent', fg: i === cur ? '#FFFFFF' : '#111111' };
});
var pickMonths = c.ab.map(function (ab, i) {
return {
abbr: ab,
full: c.en[i],
bg: i === cur ? '#D62839' : '#F4F1FC',
fg: i === cur ? '#FFFFFF' : '#111111',
pick: function () { h.goMonth(i); }
};
});

var ko = this.props.koFont ?? 'Single Day';
var num = this.props.numFont ?? 'Song Myung';
return {
koFont: "'" + ko + "', sans-serif",
numFont: "'" + num + "', '" + ko + "', sans-serif",
months: months,
padBottom: Math.round(viewH / 4),
monthName: c.en[cur],
miniMonths: miniMonths,
plusMarks: [1, 2, 3].reduce(function (acc, cx) {
[1, 2].forEach(function (cy) {
acc.push({ x: 'calc(3px + (100% - 6px) * ' + (cx / 4) + ')', y: 'calc(3px + (100% - 6px) * ' + (cy / 3).toFixed(4) + ')' });
});
return acc;
}, []),
scrollRef: h.scrollRef,
onScroll: h.onScroll,
clearFocus: h.clearFocus,
onTouchPt: h.onTouchPt,
pickerOpen: !!st.pickerOpen,
editorOpen: !!ed,
editorTitle: ed ? c.en[ed.m] + ' ' + ed.d + ',' : '',
yearChip: String(dr.year || new Date().getFullYear()),
yearChipColor: st.wheelOpen ? '#007AFF' : '#000000',
wheelOpen: !!st.wheelOpen,
wheelOpenStr: st.wheelOpen ? 'true' : 'false',
wheelYears: wheelYears,
yearText: st.yearText || '',
editMode: editing,
viewMode: !editing,
photoTiles: photoTiles,
showAddFirst: editing && photos.length === 0,
showAddMore: editing && photos.length > 0 && photos.length < 3,
addPhoto: eh.addPhoto,
photoAreaRef: eh.photoAreaRef,
photoH: st.photoH ? st.photoH + 'px' : '100%',
addW: st.photoH ? Math.round(st.photoH * 4 / 3) + 'px' : '160px',
addMoreW: st.photoH ? Math.max(64, Math.round(st.photoH / 2)) + 'px' : '64px',
fabMenuOpen: !!st.fabMenuOpen,
fabOpenStr: (st.fabMenuOpen || st.paletteOpen) ? 'true' : 'false',
toggleFab: eh.toggleFab,
closeFab: eh.closeFab,
openBgMenu: eh.openBgMenu,
startQuickAdd: eh.startQuickAdd,
quickSheetOpen: !!st.quickSheetOpen,
closeQuickSheet: eh.closeQuickSheet,
closeQuickSheetSoon: eh.closeQuickSheetSoon,
onQuickFiles: eh.onQuickFiles,
quickOpen: !!st.quick,
quickMsg: st.quick ? st.quick.y + '년 ' + (st.quick.m + 1) + '월 ' + st.quick.d + '일 기록에 추가할까요?' : '',
quickSub: st.quick ? '사진 ' + st.quick.urls.length + '장' : '',
quickYes: eh.quickYes,
quickNo: eh.quickNo,
gAlertOpen: !!st.gAlertTitle,
gAlertTitle: st.gAlertTitle || '',
gAlertMsg: st.gAlertMsg || '',
closeGAlert: eh.closeGAlert,
hasBody: !!dr.body,
mainLabel: editing ? (st.saving ? '저장 중…' : '저장') : '수정하기',
mainAction: editing ? eh.save : eh.startEdit,
mainBg: editing ? '#111111' : 'rgba(118, 118, 128, 0.12)',
mainFg: editing ? '#FFFFFF' : '#000000',
entryTitle: dr.title || '',
entryBody: dr.body || '',
sheetOpen: !!st.sheetOpen,
alertOpen: !!st.alertMsg,
alertMsg: st.alertMsg || '',
alertTitle: st.alertTitle || '',
confirmYear: eh.confirmYear,
boxSize: boxSize,
vvTop: Math.round(st.vvTop || 0),
vvH: Math.round(vvH),
wheelRef: eh.wheelRef,
onWheel: eh.onWheel,
toggleWheel: eh.toggleWheel,
closeWheel: eh.closeWheel,
onYearType: eh.onYearType,
closeSheet: eh.closeSheet,
closeSheetSoon: eh.closeSheetSoon,
onFiles: eh.onFiles,
onTitle: eh.onTitle,
onBody: eh.onBody,
save: eh.save,
closeAlert: eh.closeAlert,
closeEditor: eh.closeEditor,
headerRef: h.headerRef,
headerBg: rgba(bg, 0.62),
padTop: (st.hh || 102) + 10,
miniHeader: this.props.miniHeader ?? true,
bg: bg,
miniHead: miniHead,
titleBg: darkText ? 'rgba(255, 255, 255, 0.45)' : 'rgba(17, 17, 17, 0.2)',
ink: ink,
inkHead: inkHead,
inkSub: inkSub,
seasons: seasons,
bgName: bgName,
paletteOpen: !!st.paletteOpen,
paletteOpenStr: st.paletteOpen ? 'true' : 'false',
togglePalette: function () { self.setState({ paletteOpen: !(self.state || {}).paletteOpen }); },
closePalette: function () { self.setState({ paletteOpen: false }); },
openPicker: h.openPicker,
closePicker: h.closePicker,
pickMonths: pickMonths
};
}
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
